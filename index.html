    /* ============================================================================
       1. SINTESIS EFEK SUARA MEMBALIK KERTAS (WEB AUDIO API - TANPA URL EKSTERNAL)
    ============================================================================ */
    class PaperAudioEngine {
      constructor() {
        this.ctx = null;
      }
      play(muted = false) {
        if (muted) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.ctx) this.ctx = new AudioCtx();
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const duration = 0.24;
          const sampleRate = this.ctx.sampleRate;
          const frameCount = Math.floor(sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, frameCount, sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < frameCount; i++) {
            const t = i / frameCount;
            const env = Math.sin(t * Math.PI) * Math.pow(1 - t, 0.55);
            data[i] = (Math.random() * 2 - 1) * env * 0.32;
          }

          const src = this.ctx.createBufferSource();
          src.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1050, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(2200, this.ctx.currentTime + duration * 0.6);
          filter.Q.value = 1.3;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.4, this.ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start();
        } catch (e) {}
      }
    }
    const paperAudio = new PaperAudioEngine();

    /* ============================================================================
       4. KOMPONEN RENDER HALAMAN BUKU + WIDGET INTERAKTIF MENGAMBANG
    ============================================================================ */
    function BookPageRenderer({
      page,
      pageNumber,
      totalPages,
      branding,
      isDarkBg,
      side,
      onJumpToPage,
      onTriggerWidget,
    }) {
      if (!page) {
        return (
          <div className="w-full h-full flex items-center justify-center bg-slate-50 text-slate-300">

      const formatPageNumber = () => {
        if (!branding.showPageNumbers) return '';
        return branding.pageNumberFormat
          .replace('{n}', String(pageNumber))
          .replace('{total}', String(totalPages));
      };

      const spineOverlay =
        side === 'left'
          ? 'spine-shadow-left'
          : side === 'right'
          ? 'spine-shadow-right'
          : '';

      // Render overlay widget interaktif (Link, Audio, Video, Formulir, Embed)
      const renderWidgetsOverlay = () => {
        if (!page.widgets || page.widgets.length === 0) return null;
        return (
          <div className="absolute inset-0 pointer-events-none z-20">
            {page.widgets.map((w) => {
              const iconMap = {
                link: '🔗',
                audio: '🔊',
                video: '🎬',
                form: '📝',
                embed: '🌐',

              return (
                <button
                  key={w.id}

                    left: `${w.x ?? 50}%`,

          return `https://www.youtube.com/embed/${id}`;

        return rawUrl;

    /* ============================================================================
       6. MODAL BAGIKAN (GAYA TAUTAN SAMPUL, QR CODE, EMAIL, SOSMED & EMBED CODE)
    ============================================================================ */
    function SharePublishModal({
      isOpen,
      onClose,
      currentPage,
      branding,
      cloudShareUrl,
      onSaveToCloud,
      isSavingCloud,
    }) {
      const qrRef = useRef(null);
      const [activeTab, setActiveTab] = useState('link'); // 'link' | 'embed'
      const [linkStyle, setLinkStyle] = useState('card'); // 'card' | 'direct' | 'page'
      const [embedStyle, setEmbedStyle] = useState('responsive'); // 'responsive' | 'compact' | 'popup'
      const [copiedTarget, setCopiedTarget] = useState('');

      const baseShareUrl = useMemo(() => {
        if (cloudShareUrl) return cloudShareUrl;
        try {
          const u = new URL(window.location.href);
          u.searchParams.set('mode', 'reader');
          if (linkStyle === 'page') {
            u.searchParams.set('page', String(currentPage));
          } else {
            u.searchParams.set('page', '1');
          }
          return u.toString();
        } catch (e) {
          return `${window.location.origin}${window.location.pathname}?page=${currentPage}&mode=reader`;
        }
      }, [cloudShareUrl, currentPage, linkStyle, isOpen]);

      const finalLink = useMemo(() => {
        if (!cloudShareUrl) return baseShareUrl;
        const sep = cloudShareUrl.includes('?') ? '&' : '?';
        return linkStyle === 'page'
          ? `${cloudShareUrl}${sep}page=${currentPage}`
          : cloudShareUrl;
      }, [cloudShareUrl, baseShareUrl, linkStyle, currentPage]);

      const embedCode = useMemo(() => {
        if (embedStyle === 'compact') {
          return `<iframe src="${finalLink}" width="640" height="450" style="border:1px solid #e2e8f0;border-radius:16px;" allowfullscreen loading="lazy"></iframe>`;
        }
        if (embedStyle === 'popup') {
          return `<a href="${finalLink}" target="_blank" rel="noopener" style="display:inline-block;padding:12px 24px;background:${branding.primaryColor};color:#fff;font-family:sans-serif;font-weight:bold;border-radius:12px;text-decoration:none;">📖 Baca ${branding.title}</a>`;
        }
        return `<div style="position:relative;padding-bottom:68%;height:0;overflow:hidden;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,0.12);"><iframe src="${finalLink}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen loading="lazy"></iframe></div>`;
      }, [embedStyle, finalLink, branding]);

      useEffect(() => {
        if (!isOpen || activeTab !== 'link' || !qrRef.current) return;
        qrRef.current.innerHTML = '';
        if (window.QRCode) {
          new window.QRCode(qrRef.current, {
            text: finalLink,
            width: 152,
            height: 152,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: window.QRCode.CorrectLevel.M,
          });
        }
      }, [isOpen, activeTab, finalLink]);

      if (!isOpen) return null;

      const copyText = (text, label) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          setCopiedTarget(label);
          setTimeout(() => setCopiedTarget(''), 2500);
        } catch (e) {}
        document.body.removeChild(ta);
      };

      const encodedUrl = encodeURIComponent(finalLink);
      const encodedTitle = encodeURIComponent(`Baca publikasi interaktif "${branding.title}"`);

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
          onClick={onClose}
        >
          <div
            className="animate-pop w-full max-w-lg rounded-2xl bg-white border border-slate-200 shadow-2xl overflow-hidden text-slate-800 max-h-[92dvh] flex flex-col"

    /* ============================================================================
       7. APLIKASI UTAMA: LONTAR STUDIO — PEMBUAT & PEMBACA FLIP BOOK CERAH
    ============================================================================ */
    function FlipBookStudioApp() {
      const initialPageNum = useMemo(() => {
        const gasPage = parseInt(window.GAS_PARAMS?.page, 10);
        if (!isNaN(gasPage) && gasPage >= 1) return gasPage;
        try {
          const p = parseInt(new URLSearchParams(window.location.search).get('page'), 10);
          if (!isNaN(p) && p >= 1) return p;
        } catch (e) {}
        return 1;
      }, []);

      const initialReaderMode = useMemo(() => {
        if (window.GAS_PARAMS?.mode === 'reader') return true;
        try {
          return new URLSearchParams(window.location.search).get('mode') === 'reader';
        } catch (e) {
          return false;
        }
      }, []);

      // State Utama Buku & Merek
      const [pages, setPages] = useState(DEFAULT_PAGES);
      const [branding, setBranding] = useState(DEFAULT_BRANDING);
      const [currentPage, setCurrentPage] = useState(initialPageNum);

      // State Mode Studio (Editor Terbuka) vs Mode Pembaca Penuh
      const [isStudioOpen, setIsStudioOpen] = useState(!initialReaderMode);
      const [studioTab, setStudioTab] = useState('pdf'); // 'pdf' | 'brand' | 'widgets'

      // State Konversi PDF
      const [isConvertingPdf, setIsConvertingPdf] = useState(false);
      const [pdfProgress, setPdfProgress] = useState({ current: 0, total: 0 });

      // State Form Tambah Widget Baru
      const [newWidgetType, setNewWidgetType] = useState('link');
      const [newWidgetLabel, setNewWidgetLabel] = useState('');
      const [newWidgetUrl, setNewWidgetUrl] = useState('');
      const [newWidgetY, setNewWidgetY] = useState(80);
      const [activeWidgetModal, setActiveWidgetModal] = useState(null);

      // State Responsivitas Layar & Mode Tampilan Halaman
      const [isMobile, setIsMobile] = useState(() => window.innerWidth < 768);
      const [viewMode, setViewMode] = useState(() => (window.innerWidth < 768 ? 'single' : 'spread'));
      const [manualViewOverride, setManualViewOverride] = useState(false);

      // State Animasi Transisi (Flip 3D / Geser / Coverflow)
      const [flipAnim, setFlipAnim] = useState(null);
      const [slideAnimClass, setSlideAnimClass] = useState('');

      // State Zoom, Pan, Audio, Share & Cloud Drive
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [isShareOpen, setIsShareOpen] = useState(false);
      const [isTocOpen, setIsTocOpen] = useState(false);
      const [cloudFileId, setCloudFileId] = useState(window.GAS_PARAMS?.bookId || '');
      const [cloudShareUrl, setCloudShareUrl] = useState('');
      const [isSavingCloud, setIsSavingCloud] = useState(false);
      const [toast, setToast] = useState('');

      const panStartRef = useRef({ x: 0, y: 0 });
      const touchStartRef = useRef(null);
      const pdfInputRef = useRef(null);
      const logoInputRef = useRef(null);

      const notify = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2800);
      }, []);

      // Muat otomatis dari Google Drive jika dibuka dengan parameter ?id=...
      useEffect(() => {
        const bookId = window.GAS_PARAMS?.bookId || new URLSearchParams(window.location.search).get('id');
        if (bookId && window.google && window.google.script && window.google.script.run) {
          window.google.script.run
            .withSuccessHandler((res) => {
              if (res && res.success && res.data) {
                if (res.data.branding) setBranding(res.data.branding);
                if (res.data.pages) setPages(res.data.pages);
                setCloudFileId(res.fileId);
                notify('Publikasi dimuat dari Google Drive!');
              }
            })
            .loadFlipbookProject(bookId);
        }
      }, [notify]);

      // Responsivitas Viewport
      useEffect(() => {
        const onResize = () => {
          const mobile = window.innerWidth < 768;
          setIsMobile(mobile);
          if (!manualViewOverride) {
            setViewMode(mobile ? 'single' : 'spread');
          }
        };
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, [manualViewOverride]);

      useEffect(() => {
        if (zoom <= 1) setPan({ x: 0, y: 0 });
      }, [zoom]);

      // Konversi File PDF Ukuran Apa Pun Menggunakan PDF.js
      const handlePdfUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!window.pdfjsLib) {
          notify('Pustaka PDF.js sedang dimuat, coba sesaat lagi.');
          return;
        }

        setIsConvertingPdf(true);
        setPdfProgress({ current: 0, total: 0 });

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const total = pdfDoc.numPages;
          setPdfProgress({ current: 0, total });

          const convertedPages = [];
          // Skala render adaptif agar PDF ukuran besar tetap tajam namun ringan di HP
          for (let pageNum = 1; pageNum <= total; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const rawViewport = page.getViewport({ scale: 1 });
            const targetWidth = 1100;
            const scale = Math.min(2.0, Math.max(1.1, targetWidth / rawViewport.width));
            const viewport = page.getViewport({ scale });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport }).promise;
            const imageUrl = canvas.toDataURL('image/jpeg', 0.86);

            convertedPages.push({
              id: pageNum,
              type: 'image',
              chapter: `Halaman ${pageNum}`,
              imageUrl,
              widgets: [],
            });

            setPdfProgress({ current: pageNum, total });
          }

          const cleanName = file.name.replace(/\.pdf$/i, '');
          setPages(convertedPages);
          setBranding((prev) => ({ ...prev, title: cleanName }));
          setCurrentPage(1);
          setZoom(1);
          notify(`Berhasil mengonversi ${total} halaman PDF menjadi Flip Book!`);
        } catch (err) {
          notify('Gagal membaca PDF: ' + err.message);
        } finally {
          setIsConvertingPdf(false);
          e.target.value = '';
        }
      };

      // Unggah Logo Kustom
      const handleLogoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setBranding((prev) => ({ ...prev, logoUrl: reader.result }));
          notify('Logo merek diperbarui!');
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      // Tambah Widget Interaktif ke Halaman Aktif
      const handleAddWidget = (e) => {
        e.preventDefault();
        const defaultLabels = {
          link: 'Kunjungi Tautan ↗',
          audio: 'Putar Audio Narasi',
          video: '▶ Tonton Video',
          form: 'Isi Formulir Interaktif',
          embed: 'Buka Sematan Web',
        };
        const widgetObj = {
          id: 'w-' + Date.now(),
          type: newWidgetType,
          label: newWidgetLabel.trim() || defaultLabels[newWidgetType],
          url: newWidgetUrl.trim(),
          x: 50,
          y: Number(newWidgetY) || 80,
          color: branding.primaryColor,
        };

        setPages((prev) =>
          prev.map((p, idx) =>
            idx === currentPage - 1
              ? { ...p, widgets: [...(p.widgets || []), widgetObj] }
              : p
          )
        );
        setNewWidgetLabel('');
        setNewWidgetUrl('');
        notify(`Widget ${newWidgetType.toUpperCase()} ditambahkan ke Halaman ${currentPage}!`);
      };

      const handleRemoveWidget = (widgetId) => {
        setPages((prev) =>
          prev.map((p, idx) =>
            idx === currentPage - 1
              ? { ...p, widgets: (p.widgets || []).filter((w) => w.id !== widgetId) }
              : p
          )
        );
      };

      // Eksekusi Klik Widget pada Halaman
      const handleTriggerWidget = (widget) => {
        if (widget.type === 'link') {
          if (widget.url) {
            window.open(widget.url, '_blank', 'noopener,noreferrer');
          } else {
            notify('Tautan belum diatur pada widget ini.');
          }
          return;
        }
        setActiveWidgetModal(widget);
      };

      // Simpan Proyek ke Google Drive via google.script.run
      const handleSaveToDrive = () => {
        if (!(window.google && window.google.script && window.google.script.run)) {
          notify('Mode pratinjau lokal: siap disimpan saat di-deploy ke Google Apps Script.');
          return;
        }
        setIsSavingCloud(true);
        const payload = JSON.stringify({ branding, pages });
        window.google.script.run
          .withSuccessHandler((res) => {
            setIsSavingCloud(false);
            if (res && res.success) {
              setCloudFileId(res.fileId);
              setCloudShareUrl(res.shareUrl);
              notify('Proyek berhasil disimpan ke Google Drive!');
            } else {
              notify(res?.message || 'Gagal menyimpan ke Google Drive.');
            }
          })
          .withFailureHandler((err) => {
            setIsSavingCloud(false);
            notify('Galat server: ' + err.message);
          })
          .saveFlipbookProject(payload, cloudFileId);
      };

      // Navigasi Halaman dengan 3 Efek Pilihan: Flip 3D, Geser (Slide), & Coverflow
      const goToPage = useCallback(
        (target) => {
          const clamped = Math.max(1, Math.min(pages.length, target));
          if (clamped === currentPage) return;

          const dir = clamped > currentPage ? 'next' : 'prev';
          paperAudio.play(isMuted);

          if (branding.transitionEffect === 'flip') {
            setFlipAnim({
              direction: dir,
              frontPage: pages[currentPage - 1],
              backPage: pages[clamped - 1],
              started: false,
            });
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                setFlipAnim((prev) => (prev ? { ...prev, started: true } : null));
              });
            });
            setTimeout(() => setFlipAnim(null), 640);
          } else {
            setSlideAnimClass(dir === 'next' ? 'anim-slide-next' : 'anim-slide-prev');
            setTimeout(() => setSlideAnimClass(''), 380);
          }

          setCurrentPage(clamped);
        },
        [currentPage, pages, isMuted, branding.transitionEffect]
      );

      const handleNext = useCallback(() => {
        if (currentPage >= pages.length) return;
        if (viewMode === 'single' || branding.transitionEffect === 'coverflow') {
          goToPage(currentPage + 1);
        } else {
          goToPage(currentPage === 1 ? 2 : Math.min(pages.length, currentPage + 2));
        }
      }, [currentPage, pages.length, viewMode, branding.transitionEffect, goToPage]);

      const handlePrev = useCallback(() => {
        if (currentPage <= 1) return;
        if (viewMode === 'single' || branding.transitionEffect === 'coverflow') {
          goToPage(currentPage - 1);
        } else {
          goToPage(currentPage <= 3 ? 1 : Math.max(1, currentPage - 2));
        }
      }, [currentPage, viewMode, branding.transitionEffect, goToPage]);

      // Pasangan Halaman Spread
      const spreadPages = useMemo(() => {
        const total = pages.length;
        if (viewMode === 'single' || branding.transitionEffect === 'coverflow') {
          return { isSingle: true, single: pages[currentPage - 1] };
        }
        if (currentPage === 1 || (total % 2 === 0 && currentPage === total)) {
          return { isSingle: true, single: pages[currentPage - 1] };
        }
        const leftIdx = currentPage % 2 === 0 ? currentPage - 1 : currentPage - 2;
        return {
          isSingle: false,
          left: pages[leftIdx] || null,
          right: pages[leftIdx + 1] || null,
        };
      }, [pages, currentPage, viewMode, branding.transitionEffect]);

      // Gestur Swipe Sentuh & Pan
      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
          const t = e.touches[0];
          touchStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
          if (zoom > 1) {
            setIsPanning(true);
            panStartRef.current = { x: t.clientX - pan.x, y: t.clientY - pan.y };
          }
        }
      };

      const handleTouchMove = (e) => {
        if (e.touches.length === 1 && zoom > 1 && isPanning) {
          const t = e.touches[0];
          setPan({ x: t.clientX - panStartRef.current.x, y: t.clientY - panStartRef.current.y });
        }
      };

      const handleTouchEnd = (e) => {
        setIsPanning(false);
        if (!touchStartRef.current || e.changedTouches.length !== 1) return;
        const end = e.changedTouches[0];
        const dx = end.clientX - touchStartRef.current.x;
        const dy = end.clientY - touchStartRef.current.y;
        if (zoom === 1 && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          if (dx < 0) handleNext();
          else handlePrev();
        }
        touchStartRef.current = null;
      };

      // Tema Latar Belakang Stage Cerah
      const bgThemeClass = {
        'bright-sky': 'bg-gradient-to-br from-indigo-100 via-white to-rose-50 text-slate-800',
        'warm-cream': 'bg-gradient-to-br from-amber-100/80 via-[#fffdf7] to-orange-50 text-slate-800',
        'mint-breeze': 'bg-gradient-to-br from-emerald-100/70 via-white to-teal-50 text-slate-800',
        'dark-night': 'bg-slate-900 text-slate-100',
      }[branding.bgStyle] || 'bg-sky-50 text-slate-800';

      const iconRadiusClass = {
        rounded: 'rounded-xl',
        pill: 'rounded-full',
        sharp: 'rounded-md',
      }[branding.iconStyle] || 'rounded-xl';

      const currentPageObj = pages[currentPage - 1];

      return (
        <div
          className={`h-dvh w-screen overflow-hidden flex flex-col justify-between transition-colors duration-300 ${bgThemeClass}`}
          style={{ '--accent-color': branding.primaryColor }}
        >
          {/* ==================================================================
              HEADER NAVIGASI CERAH & MODERN
          ================================================================== */}
          <header className="z-30 shrink-0 px-3 sm:px-5 py-2.5 bg-white/85 backdrop-blur-md border-b border-slate-200/80 flex items-center justify-between gap-2 shadow-sm">
            {/* Kiri: Logo Merek + Judul */}
            <div className="flex items-center gap-2.5 min-w-0">
              <button
                onClick={() => setIsTocOpen(true)}
                className={`p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors shrink-0 ${iconRadiusClass}`}
                title="Daftar Isi & Miniatur Halaman"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h12M4 18h8" />
                </svg>
              </button>

              {branding.logoUrl ? (
                <img src={branding.logoUrl} alt="Logo" className="w-8 h-8 rounded-lg object-cover border border-slate-200 shrink-0" />
              ) : (
                <MoonlightBookLogo className="w-9 h-9 rounded-lg shrink-0 shadow-sm" />
              )}

              <div className="min-w-0">
                <h1 className="font-bold text-sm sm:text-base text-slate-900 truncate leading-tight">
                  {branding.title}
                </h1>
                <p className="text-[11px] text-slate-500 truncate">
                  {branding.publisher} • {currentPageObj?.chapter || `Halaman ${currentPage}`}
                </p>
              </div>
            </div>

            {/* Kanan: Tombol Studio Kustomisasi, Suara, Mode Tampilan & Bagikan */}
            <div className="flex items-center gap-1.5 shrink-0">
              <button
                onClick={() => setIsStudioOpen((v) => !v)}
                className={`px-3 py-2 text-xs font-bold flex items-center gap-1.5 transition-all border ${iconRadiusClass} ${

                    ((currentPage - 1) / Math.max(1, pages.length - 1)) * 100
                  }%, #e2e8f0 ${
                    ((currentPage - 1) / Math.max(1, pages.length - 1)) * 100
                  }%, #e2e8f0 100%)`,
                  height: '6px',
                  borderRadius: '999px',
                }}
              />

              <button
                onClick={() => setIsTocOpen(true)}
                className={`px-2.5 py-1.5 text-xs font-mono font-bold bg-sky-50 text-sky-700 border border-sky-200 shrink-0 ${iconRadiusClass}`}
              >
                {currentPage} / {pages.length}
              </button>

              <button
                onClick={handleNext}
                disabled={currentPage >= pages.length}
                style={{ backgroundColor: branding.primaryColor }}
                className={`px-3.5 py-2 text-xs font-bold text-white disabled:opacity-35 shadow-sm hover:brightness-110 transition-all shrink-0 ${iconRadiusClass}`}
              >
                <span className="hidden sm:inline">Berikutnya</span> →
              </button>
            </div>
          </footer>

          {/* ==================================================================
              DRAWER MINIATUR HALAMAN (DAFTAR ISI)
          ================================================================== */}
          {isTocOpen && (
            <div
              className="fixed inset-0 z-50 flex justify-start bg-slate-900/50 backdrop-blur-sm"
              onClick={() => setIsTocOpen(false)}
            >
              <div
                className="animate-pop w-full max-w-sm h-full bg-white shadow-2xl flex flex-col"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-sm text-slate-900">Semua Halaman ({pages.length})</h3>
                    <p className="text-[11px] text-slate-500">Ketuk halaman untuk melompat cepat</p>
                  </div>
                  <button
                    onClick={() => setIsTocOpen(false)}
                    className="p-2 rounded-xl hover:bg-slate-100"
                  >
                    ✕
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto custom-scroll p-3 grid grid-cols-2 gap-2.5">
                  {pages.map((p, idx) => {
                    const num = idx + 1;
                    return (
                      <button
                        key={p.id || num}
                        onClick={() => {
                          goToPage(num);
                          setIsTocOpen(false);
                        }}
                        className={`p-2 rounded-xl border text-left transition-all ${
                          num === currentPage
                            ? 'border-sky-500 bg-sky-50 ring-2 ring-sky-500/20'
                            : 'border-slate-200 hover:border-sky-300'
                        }`}
                      >
                        <div className="aspect-[3/4] rounded-lg bg-slate-100 mb-1.5 overflow-hidden flex items-center justify-center relative">
                          {p.type === 'image' ? (
                            <img src={p.imageUrl} alt="" className="w-full h-full object-cover" />
                          ) : (
                            <div className="p-2 text-[10px] font-serif font-bold text-slate-700 line-clamp-3">
                              {p.title || p.chapter}
                            </div>
                          )}
                          <span className="absolute bottom-1 right-1 px-1.5 py-0.5 rounded bg-slate-900/75 text-white text-[9px] font-mono">
                            {num}
                          </span>
                        </div>
                        <div className="text-[11px] font-semibold text-slate-800 truncate">
                          {p.chapter || `Halaman ${num}`}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* MODAL JALANKAN WIDGET INTERAKTIF */}
          <WidgetRunnerModal
            widget={activeWidgetModal}
            onClose={() => setActiveWidgetModal(null)}
            branding={branding}
          />

          {/* MODAL BAGIKAN & KODE SEMAT WEBSITE */}
          <SharePublishModal
            isOpen={isShareOpen}
            onClose={() => setIsShareOpen(false)}
            currentPage={currentPage}
            branding={branding}
            cloudShareUrl={cloudShareUrl}
            onSaveToCloud={handleSaveToDrive}
            isSavingCloud={isSavingCloud}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FlipBookStudioApp />);
  </script>
</body>
</html>
